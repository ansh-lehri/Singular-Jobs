<!doctype html>
<html lang="en" class="no-js">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="x-ua-compatible" content="ie=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Change Password</title>
		
		{% load static %}
		<link rel="stylesheet" type="text/css" href="{% static 'css/change_password.css' %}" />
		<link rel="stylesheet" type="text/css" href="{% static 'css/errors.css' %}" />
	</head>
	
	<body>
		<header>
			<nav class="flex-container-1">
				<a id="singular-jobs" href="https://singularjobs.herokuapp.com/singular-jobs">Singular Jobs</a>
			</nav>
		</header>
		
		{% if messages %}
		<div class="message-lists">
		<ul class="messages">
			{% for message in messages %}
			<li{% if message.tags %} class="{{ message.tags }} message"{% endif %}>
			{{ message }}
			<a href="https://singularjobs.herokuapp.com/singular-jobs/change_password" class="{{ message.tags }} message">&times;</a>
			</li>
			{% endfor %}
		</ul>
		</div>
		{% endif %}
		
		<script>
		var message_ele = document.getElementById("message");

		setTimeout(function(){ 
		   message_ele.style.display = "none"; 
		}, 3000);
		
		</script>
		
		
		<p id="heading"> Please enter the following details :</p>
		<div class="flex-item">
				<form class="try" method="POST" name="change_password">{% csrf_token %}	
					
					<div class="user-fields">
						<label id="fieldname"  for="email">E-Mail:</label><br>
						<input id="user-area" type="email" id="email" name="email" required>
					</div>
					
					<div class="user-fields">
						<label id="fieldname"  for="new_password">New Password:</label><br>
						<input id="user-area" type="password" id="new_password" name="new_password" required>
					</div>
					
					<div class="user-fields">
						<label id="fieldname"  for="confirm_password">Confirm Password:</label><br>
						<input id="user-area" type="password" id="confirm_password" name="confirm_password" required>
					</div>
					
					<input id="login" type="submit" value="Change Password">
					
				</form>
			</div>
	</body>
</html>
